name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...

  # ── Tests (native per-platform, -race enabled) ───────────────────────────
  test:
    name: Test / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin/arm64
          - runner: macos-15-intel
            target: darwin/amd64
          - runner: ubuntu-22.04
            target: linux/amd64
          - runner: ubuntu-22.04-arm
            target: linux/arm64
          - runner: windows-2022
            target: windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test ./... -race -count=1

  # ── Cross-compile (CGO_ENABLED=0, all 5 targets from ubuntu) ─────────────
  build:
    name: Build / ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            target: darwin/arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            target: darwin/amd64
            ext: ""
          - goos: linux
            goarch: amd64
            target: linux/amd64
            ext: ""
          - goos: linux
            goarch: arm64
            target: linux/arm64
            ext: ""
          - goos: windows
            goarch: amd64
            target: windows/amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w -X main.version=ci" -o dist/flightlog${{ matrix.ext }} ./cmd/flightlog
      - name: Check binary ≤25 MB
        shell: bash
        run: |
          size=$(du -m "dist/flightlog${{ matrix.ext }}" | cut -f1)
          echo "Binary size: ${size} MB"
          [ "$size" -le 25 ] || { echo "FAIL: binary exceeds 25 MB limit"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: flightlog-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/flightlog${{ matrix.ext }}
          retention-days: 1

  # ── E2E smoke test (runs built binary --version on native runner) ─────────
  e2e:
    name: E2E smoke / ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            goos: darwin
            goarch: arm64
            target: darwin/arm64
            ext: ""
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            target: darwin/amd64
            ext: ""
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            target: linux/amd64
            ext: ""
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            target: linux/arm64
            ext: ""
          - runner: windows-2022
            goos: windows
            goarch: amd64
            target: windows/amd64
            ext: ".exe"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flightlog-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist
      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x dist/flightlog
      - name: Smoke test --version
        shell: bash
        run: dist/flightlog${{ matrix.ext }} --version

  # ── Golden snapshot diff ─────────────────────────────────────────────────
  golden:
    name: Golden snapshot diff
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golden tests
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/metrics/... -run TestGolden -count=1

  # ── Concurrent DB test ───────────────────────────────────────────────────
  concurrent:
    name: Concurrent DB test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: TestConcurrent
        env:
          CGO_ENABLED: "0"
        run: go test ./internal/db -run TestConcurrent -count=1 -v

  # ── Benchmark cold open ≤60ms ────────────────────────────────────────────
  bench:
    name: Benchmark cold open
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: BenchmarkColdOpen (fail if median >60ms)
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./internal/db -bench=BenchmarkColdOpen -benchtime=10x -run=^$ | tee bench.out
          ns=$(grep 'BenchmarkColdOpen' bench.out | awk '{print $3}' | head -1)
          if [ -z "$ns" ]; then echo "FAIL: no BenchmarkColdOpen output found"; exit 1; fi
          echo "Result: ${ns} ns/op"
          python3 -c "
          ns = float('${ns}')
          limit = 60_000_000  # 60 ms in nanoseconds
          print(f'ns/op={ns:.0f}  limit={limit}  margin={(limit-ns)/1e6:.1f}ms')
          raise SystemExit(0 if ns <= limit else 1)
          "

  # ── Lint evidence doc (Phase E — skipped until file lands) ───────────────
  lint-evidence-doc:
    name: Lint Phase E docs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check alpha journal if present
        run: |
          if [ -f ".omc/specs/alpha-dogfood-log.md" ]; then
            bash scripts/lint_alpha_journal.sh .omc/specs/alpha-dogfood-log.md
          else
            echo ".omc/specs/alpha-dogfood-log.md absent — skipping"
          fi
      - name: Check evidence doc if present
        run: |
          if [ -f "docs/v2-ga-acceptance-evidence.md" ]; then
            bash scripts/lint_evidence_doc.sh docs/v2-ga-acceptance-evidence.md
          else
            echo "docs/v2-ga-acceptance-evidence.md absent — skipping (arrives in Phase E)"
          fi
      - name: Check Phase E readiness scaffold
        run: |
          if [ -f "scripts/phase_e_readiness.sh" ]; then
            bash scripts/phase_e_readiness.sh
          else
            echo "scripts/phase_e_readiness.sh absent — skipping"
          fi
